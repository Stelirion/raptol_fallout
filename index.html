<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal Fallout — V5.3 (FR • CRT)</title>
    <style>

        :root {

            --g: #7CFF91;
            --g-rgb: 124, 255, 145;
            --y: #FFD75E;
            --line: rgba(var(--g-rgb), .18);

        }

        :root[data-theme="amber"] {
            --g: #FFC107;
            --g-rgb: 255, 193, 7;
            --y: #FFE08A;
            --line: rgba(var(--g-rgb), .16);
        }

:root[data-theme="blue"]{
  --g: #39c0ff;        
  --g-rgb: 57,192,255;
}

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: #0b0b0b;
            color: var(--g);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace
        }

        .crt {
            position: relative;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            background: #000;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-sizing: border-box;
              overflow: hidden;
  background-clip: padding-box;

        }

        .crt::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
              background: radial-gradient(
    ellipse at center,
    rgba(var(--g-rgb), .14) 0%,
    rgba(var(--g-rgb), .08) 35%,
    rgba(0,0,0,0)          70%
  ); }

        .crt,
        .crt * {
            text-shadow:
                0 0 4px rgba(var(--g-rgb), .78),
                0 0 10px rgba(var(--g-rgb), .48);
        }

        .crt::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.06) 0 1px,
      rgba(0,0,0,0)         1px 3px
    );
    mix-blend-mode: soft-light;
    opacity: .22;
    border-radius: inherit;
}

        @keyframes flicker {

            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 1
            }

            20%,
            24%,
            55% {
                opacity: .92
            }

            22% {
                opacity: .96
            }
        }

        .crt {
            animation: flicker 2.2s infinite
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: relative;
            z-index: 3
        }

        .banner {
            white-space: pre;
            opacity: .9;
            user-select: none
        }

        .icon,
        .btn {
            background: transparent;
            color: var(--g);
            border: 1px solid var(--line);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer
        }

        .icon:hover,
        .btn:hover {
            background: rgba(var(--g-rgb), .08)
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
            margin: 10px 0
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, .35)
        }

        .scroll {
            overflow: auto
        }

        .h {
            font-weight: 700;
            margin: .25rem 0 .5rem
        }

        .tiny {
            font-size: .8rem;
            opacity: .65
        }

        #console {
            white-space: pre-wrap;
            line-height: 1.25;
            min-height: 420px
        }

        .prompt {
            display: inline
        }

        .caret {
            display: inline-block;
            width: 8px;
            height: 1em;
            vertical-align: -0.2em;
            background: var(--g);
            margin-left: 2px;
            animation: blink .9s steps(2) infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .2
            }
        }

        .mlink {
            display: inline-block;
            padding: 0 2px;
            border-radius: 3px;
            cursor: pointer
        }

       .mlink:hover { background: rgba(var(--g-rgb), .12) }
        

        .hackwall {
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            user-select: none;
            margin-top: 8px
        }

        .hackwall .c {
            pointer-events: none
        }

        .hackwall .w {
            display: inline;
            padding: 0 1px;
            border-radius: 2px;
            cursor: pointer;
            background: transparent;
            color: var(--y);
            border: none;
            outline: 1px dashed transparent;
            transition: background .15s ease
        }

        .hackwall .w:hover {
            background: rgba(var(--g-rgb), .14);
            outline-color: var(--y)
        }

        .triesBar {
            height: 6px;
            background: rgba(var(--g-rgb), .15);
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px
        }

        .triesFill {
            height: 100%;
            width: 100%;
            background: var(--y)
        }

        textarea,
        input,
        select {
            background: #000;
            color: var(--g);
            border: 1px solid var(--line);
            border-radius: 6px
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 10px
        }

        label {
            display: block;
            margin: 6px 0
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .94);
            display: none;
            place-items: center;
            padding: 20px;
            z-index: 1000
        }

        .overlay.active {
            display: grid
        }

        .overlay .card {
            max-height: 90vh;
            overflow: auto;
        }

        body.glitch .crt {
            filter: contrast(1.05) saturate(1.05)
        }

body.glitch:before { content: none; }

body.glitch .crt::after { opacity: .28; }

        .mj-editor {
            background: #000;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0
        }

        .mj-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .mj-col {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, .35)
        }

        .mj-h {
            font-weight: 700;
            margin: 2px 0 8px
        }

        .mj-tiny {
            font-size: .82rem;
            opacity: .7
        }

        .mj-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
            margin: 10px 0
        }

        .mj-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap
        }

        .mj-btn {
            background: transparent;
            color: var(--g);
            border: 1px solid var(--line);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer
        }

        .mj-btn:hover {
            background: rgba(var(--g-rgb), .08)
        }

        .mj-tabpage {
            display: none
        }

        .mj-tabpage.active {
            display: block
        }

        .mj-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 8px;
            align-items: center;
            padding: 6px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: rgba(0, 0, 0, .25)
        }

        .mj-list {
            display: grid;
            gap: 8px
        }

        .mj-field {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 6px 0
        }

        .mj-field label {
            min-width: 120px
        }

        .mj-editor input[type="text"],
        .mj-editor input[type="number"],
        .mj-editor textarea,
        .mj-editor select {
            background: #000;
            color: var(--g);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px;
            width: 100%;
        }

        .mj-editor textarea {
            min-height: 120px
        }

        .mj-badge {
            font-size: .75rem;
            padding: 2px 6px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(var(--g-rgb), .06)
        }

        .mj-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end
        }

        .mj-flex {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .mj-grow {
            flex: 1
        }

        .mj-note {
            padding: 6px 8px;
            border: 1px dashed var(--line);
            border-radius: 6px;
            background: rgba(var(--g-rgb), .06)
        }

        .mj-muted {
            color: #9fe7ad;
            opacity: .8
        }

        .mj-row-1 {
            display: block
        }

        @media (max-width: 960px) {
            .mj-row {
                grid-template-columns: 1fr
            }
        }

        #adminPanel.refresh {
            --panel-border: rgba(var(--g-rgb), .14);
            --panel-bg: rgba(0, 0, 0, .48);
            --panel-ghost: rgba(var(--g-rgb), .03);
            backdrop-filter: blur(6px);
        }

        #adminPanel.refresh .h {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 10px 12px;
            margin: 10px 0 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--panel-ghost), transparent);
        }

        #adminPanel.refresh .box,
        #adminPanel.refresh .group,
        #adminPanel.refresh .panel,
        #adminPanel.refresh .menus {
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel-bg);
            padding: 12px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .02);
        }

        #adminPanel.refresh .two> :first-child label {
            display: grid;
            grid-template-columns: 1fr minmax(240px, 320px);
            gap: 10px;
            align-items: center;
            padding: 8px 10px;
            margin: 6px 0;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            background: rgba(var(--g-rgb), .02);
        }

        #adminPanel.refresh #wizRoot label {
            display: inline;
            border: 0;
            background: none;
            padding: 0;
            margin: 0;
        }

        #adminPanel.refresh #wizRoot .mj-item {
            overflow: visible;
        }

        #adminPanel.refresh #wizRoot .mj-actions {
            position: relative;
            z-index: 2;
        }

        #adminPanel.refresh input[type="text"],
        #adminPanel.refresh input[type="password"],
        #adminPanel.refresh input[type="number"],
        #adminPanel.refresh select,
        #adminPanel.refresh textarea {
            width: 100%;
            color: var(--g);
            background: rgba(0, 0, 0, .65);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 8px 10px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(var(--g-rgb), .03);
        }

        #adminPanel.refresh input:focus,
        #adminPanel.refresh select:focus,
        #adminPanel.refresh textarea:focus {
            box-shadow: 0 0 0 2px rgba(var(--g-rgb), .22), inset 0 0 0 1px rgba(var(--g-rgb), .05);
        }

        #adminPanel.refresh input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            width: 42px;
            height: 22px;
            border-radius: 999px;
            cursor: pointer;
            background: rgba(var(--g-rgb), .12);
            border: 1px solid var(--panel-border);
            transition: .18s;
        }

        #adminPanel.refresh input[type="checkbox"]::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 0 1px var(--panel-border), inset 0 0 10px rgba(var(--g-rgb), .25);
            transition: .18s;
        }

        #adminPanel.refresh input[type="checkbox"]:checked {
            background: rgba(var(--g-rgb), .28);
        }

        #adminPanel.refresh input[type="checkbox"]:checked::after {
            left: 22px;
        }

        #adminPanel.refresh .btn,
        #adminPanel.refresh .mj-btn,
        #adminPanel.refresh button {
            background: rgba(var(--g-rgb), .08);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--g);
            font-weight: 700;
            letter-spacing: .02em;
            box-shadow: 0 0 12px rgba(var(--g-rgb), .10);
            transition: transform .06s ease, box-shadow .15s ease, background .15s ease;
        }

        #adminPanel.refresh .btn:hover,
        #adminPanel.refresh .mj-btn:hover,
        #adminPanel.refresh button:hover {
            background: rgba(var(--g-rgb), .14);
            box-shadow: 0 0 18px rgba(var(--g-rgb), .18);
        }

        #adminPanel.refresh .btn:active,
        #adminPanel.refresh .mj-btn:active,
        #adminPanel.refresh button:active {
            transform: translateY(1px);
        }

        #adminPanel.refresh .btn.icon,
        #adminPanel.refresh button.icon {
            padding: 6px 8px;
            min-width: 36px;
            line-height: 1;
            border-radius: 10px;
        }

        #adminPanel.refresh .mj-badge,
        #adminPanel.refresh .mj-note {
            border: 1px dashed var(--panel-border);
            background: rgba(var(--g-rgb), .06);
            border-radius: 10px;
            padding: 8px 10px;
        }

        #adminPanel.refresh .menus .item {
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            background: rgba(0, 0, 0, .55);
        }

        #adminPanel.refresh .menus .item:hover {
            background: rgba(var(--g-rgb), .05);
        }

        #adminPanel.refresh #saveSettings {
            position: relative;
            font-size: 14px;
            padding: 10px 14px;
        }

        #adminPanel.refresh .admin-tabs {
            position: sticky;
            top: 8px;
            z-index: 20;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 12px;
            padding: 8px 8px 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
            border-radius: 10px;
        }

        #adminPanel.refresh .admin-tab {
            border: 1px solid rgba(var(--g-rgb), .16);
            background: rgba(var(--g-rgb), .07);
            color: var(--g);
            font-weight: 700;
            letter-spacing: .02em;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(var(--g-rgb), .08);
            transition: background .15s, box-shadow .15s, transform .06s;
        }

        #adminPanel.refresh .admin-tab:hover {
            background: rgba(var(--g-rgb), .12);
        }

        #adminPanel.refresh .admin-tab:active {
            transform: translateY(1px);
        }

        #adminPanel.refresh .admin-tab.active {
            background: rgba(var(--g-rgb), .18);
            box-shadow: 0 0 16px rgba(var(--g-rgb), .18);
        }

        #adminPanel.refresh .admin-sec[hidden] {
            display: none;
        }

        #adminPanel [hidden] {
            display: none !important;
        }
    </style>

<style>
#langAdminBlock{margin:12px 0;padding:10px;border:1px dashed var(--line);border-radius:8px}
#langAdminBlock .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#langAdminBlock .row .btn{padding:6px 10px;border:1px solid var(--line);background:rgba(var(--g-rgb),.06);border-radius:6px;cursor:pointer}
#langAdminBlock .row .btn:hover{background:rgba(var(--g-rgb),.12)}
#langAdminBlock .title{font-weight:600;margin-right:8px}
</style>


<style>
#langAdminBlock{margin:12px 0;padding:10px;border:1px dashed var(--line);border-radius:8px}
#langAdminBlock .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#langAdminBlock label{font-weight:600}
#adminLangSelect{padding:6px 10px;border:1px solid var(--line);background:rgba(var(--g-rgb),.06);border-radius:6px;cursor:pointer}
#adminLangSelect:hover{background:rgba(var(--g-rgb),.12)}
</style>


<style>
#adminFooterBar{
  position: sticky; bottom: 0; z-index: 5;
  display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  padding: 10px; margin-top: 12px;
  background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0));
  border-top: 1px solid var(--line);
  backdrop-filter: blur(2px);
}
#adminFooterBar .btn{
  padding: 8px 12px; border: 1px solid var(--line);
  background: rgba(var(--g-rgb), .06);
  border-radius: 8px; cursor: pointer;
}
#adminFooterBar .btn:hover{ background: rgba(var(--g-rgb), .12); }
#adminFooterBar .btn.primary{ box-shadow: 0 0 0 1px rgba(var(--g-rgb), .25) inset; }
</style>

</head>

<body>
    <div class="crt">
        <div class="top">
            <div class="banner" id="banner"></div>
            <button id="adminToggle" class="icon" title="Menu MJ (ou Ctrl+M)">☰</button>
        </div>
        <div class="divider"></div>
        <div class="grid">
            <div class="card scroll" id="mainCard">
                <div class="h" id="title"></div>
                <div class="tiny" id="subtitle"></div>
                <div class="divider"></div>
                <div id="console"></div>
                <div id="sentinel" style="height:1px"></div>
            </div>
            <div class="card scroll" style="display:grid;gap:10px;align-content:start">
                <div>
                    <div class="h">STATUT</div>
                    <div>ALIM : <span id="statPower">STANDBY</span></div>
                    <div>PORTE : <span id="statDoor">SCELLÉE</span></div>
                    <div class="tiny">* V5 — FR + CRT</div>
                </div>
                <div class="divider"></div>
                <div>
                    <div class="h">AIDE</div>
                    <div class="tiny" id="helpBox"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay refresh" id="adminPanel">
        <div class="card" style="max-width:980px;width:100%">
            <div class="h">Panneau MJ — V5</div>
            <div class="tiny">Fermer = retour mode joueur.</div>
            <div class="divider"></div>

            <div class="two">
                <div>
                    <div class="h">Réglages généraux</div>
                    <label>Couleur principale
                        <select id="setTheme">
                            <option value="green">Vert (RobCo)</option>
                            <option value="amber">Ambre</option>
                            <option value="blue">Bleu (Pip-Boy)</option>
                        </select>

    <!-- language selector hidden -->
      <!-- translate button removed -->

    
                    </label>
                    <label>🔐 Mot de passe au démarrage ?
                        <select id="setGateOn">
                            <option value="true">Oui</option>
                            <option value="false">Non</option>
                        </select>
                    </label>
                    <label>Mot de passe du JEU (écran d'auth)
                        <input id="setGamePwd" type="password" placeholder="ABRI48">
                    </label>
                    <label>Mot de passe MJ (ouvrir le panneau)
                        <input id="setAdminPwd" type="password" placeholder="(optionnel)">
                    </label>
                    <label>🧪 Hack dispo dès le départ ?
                        <select id="setHackAtStart">
                            <option value="false">Non</option>
                            <option value="true">Oui</option>
                        </select>
                    </label>
                    <label>Seuil d'échecs avant hack
                        <input id="setHackThreshold" type="number" min="1" max="10" value="3">
                    </label>
                    <label>Montrer l'intro de boot à chaque lancement ?
                        <select id="setBootAlways">
                            <option value="false">Non</option>
                            <option value="true">Oui</option>
                        </select>
                    </label>
                    <label>Effets sonores
                        <select id="setSfx">
                            <option value="true">Activés</option>
                            <option value="false">Désactivés</option>
                        </select>
                    </label>
                    <label>Effets visuels CRT / glitch (fond)
                        <select id="setGlitch">
                            <option value="false">Désactivés</option>
                            <option value="true">Activés</option>
                        </select>
                    </label>
                    <label>Effet de glitch sur les mots du hack
                        <select id="setWordGlitch">
                            <option value="true">Activé</option>
                            <option value="false">Désactivé</option>
                        </select>
                        <label>Banque de mots du hack
                            <select id="setWordMode">
                                <option value="fallout" selected>Pré-définie (Fallout)</option>
                                <option value="custom">Personnalisée (ci-dessous)</option>
                            </select>
                        </label>

                        <label id="customWordsWrap" style="display:none">Mots personnalisés (un par ligne)
                            <textarea id="setHackWords" rows="6" placeholder="EX: ABRI48
FUSION
CAPTEUR
..."></textarea>
                        </label>

                    </label>
                    <label>Difficulté du hack
                        <select id="setHackDifficulty">
                            <option value="facile">Facile</option>
                            <option value="normal" selected>Normal</option>
                            <option value="difficile">Difficile</option>
                            <option value="expert">Expert</option>
                        </select>
                    </label>
                    <label>Tentatives de hack
                        <input id="setHackTries" type="number" min="1" max="10" value="4">
                    </label>
                    <div class="mj-actions"><button class="btn" id="saveSettings">💾 Enregistrer réglages</button></div>
                </div>

                <div>

                    <div class="h">Import / Export</div>
                    <div class="two" style="margin-top:8px">
                        <button class="btn" id="btnExport">⬇️ Exporter</button>
                        <label class="btn" for="fileImport" style="cursor:pointer">⬆️ Importer</label>
                        <input id="fileImport" type="file" accept="application/json" hidden>
                    </div>
                    <div class="mj-actions" style="margin-top:8px">
                        <button class="btn" id="lockNow">🔐 Rebasculer sur l'écran d'auth</button>
                        <button class="btn" id="unlockTerminal">🔓 Débloquer (reset compteur)</button>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="h">Éditeur</div>
            <div id="wizRoot" class="mj-editor"></div>

            <div class="divider"></div>
            <div style="text-align:right">
                <span class="tiny">Échap = fermer</span>
                <div><button class="btn" id="closeAdmin">Fermer le panneau MJ</button></div>
            </div>
        </div>
    </div>

        (function(global) {

            function deepClone(o) {
                return JSON.parse(JSON.stringify(o));
            }

            function ensureData(d) {
                const x = deepClone(DEF);
                if (!d || typeof d !== 'object') return x;
                for (const k of Object.keys(x)) {
                    if (k in d) x[k] = deepClone(d[k]);
                }
                if (!Array.isArray(x.help)) x.help = [];
                if (!Array.isArray(x.banner)) x.banner = [];
                if (!Array.isArray(x.menus)) x.menus = [];
                if (typeof x.pages !== 'object' || !x.pages) x.pages = {};
                if (!Array.isArray(x.logs)) x.logs = [];
                if (!Array.isArray(x.memos)) x.memos = [];
                return x;
            }

            function el(tag, attrs, ...children) {
                const n = document.createElement(tag);
                const a = attrs || {};
                Object.keys(a).forEach(function(k) {
                    const v = a[k];
                    if (k === 'class') n.className = v;
                    else if (k === 'style') n.setAttribute('style', v);
                    else if (k.indexOf('on') === 0 && typeof v === 'function') n.addEventListener(k.slice(2), v);
                    else if (v !== undefined && v !== null) n.setAttribute(k, v);
                });
                for (let i = 0; i < children.length; i++) {
                    const c = children[i];
                    if (c == null) continue;
                    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                }
                return n;
            }

            function iconBtn(label, title, handler) {
                return el('button', {
                    class: 'mj-btn',
                    title: title,
                    onclick: handler
                }, label);
            }

            function buildMenusUI(root, data, notify) {
                data.pages = data.pages || {};
                const wrap = el('div', {
                    class: 'mj-col'
                });
                wrap.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Menus'));
                wrap.appendChild(el('div', {
                    class: 'mj-tiny'
                }, 'Type "page" → lie 1..n pages. Un menu ajouté crée automatiquement une page.'));
                const list = el('div', {
                    class: 'mj-list'
                });

                function ensurePage(id, title) {
                    data.pages = data.pages || {};
                    if (!data.pages[id]) data.pages[id] = {
                        title: title || 'PAGE',
                        body: '(contenu)'
                    };
                    try { document.dispatchEvent(new CustomEvent('mj-pages-updated')); } catch(e) {}

                }

                function newPageId() {
                    let base = 'page' + (Object.keys(data.pages || {}).length + 1);
                    while (data.pages && data.pages[base]) base += '_x';
                    return base;
                }

                function rowItem(item, idx) {
                    const chk = el('input', {
                        type: 'checkbox'
                    });
                    chk.checked = item.enabled !== false;
                    const label = el('input', {
                        type: 'text',
                        value: item.label || ''
                    });
                    const sel = el('select');
                    ['logs', 'memos', 'door', 'about', 'page'].forEach(function(a) {
                        sel.appendChild(el('option', {
                            value: a,
                            selected: item.action === a
                        }, a));
                    });

                    const pagesWrap = el('div', {
                        class: 'mj-field',
                        style: item.action === 'page' ? '' : 'display:none'
                    });
                    const pagesInput = el('input', {
                        type: 'text',
                        placeholder: 'IDs de pages séparés par des virgules'
                    });
                    let addPageBtn;
addPageBtn = iconBtn('➕ Nouvelle page liée', 'Créer et lier une page', function() {
addPageBtn.style.display = (sel.value === 'page') ? '' : 'none';
                        const id = newPageId();
                        ensurePage(id, label.value.trim() || 'PAGE');
                        const current = pagesInput.value.split(',').map(function(s) {
                            return s.trim();
                        }).filter(Boolean);
                        current.push(id);
                        pagesInput.value = current.join(', ');
                        saveRow();

lblPages.style.display = '';
pagesInput.style.display = '';
try { document.dispatchEvent(new CustomEvent('mj-pages-updated')); } catch(e) {}
                    });

                    let pagesArr = Array.isArray(item.pages) ? item.pages.slice() : (item.pageId ? [item.pageId] : []);
                pagesInput.value = pagesArr.join(', ');

const lblPages = el('label', {}, 'Pages liées');
pagesWrap.appendChild(lblPages);
pagesWrap.appendChild(pagesInput);

const hasIds = pagesInput.value.trim().length > 0;
pagesWrap.style.display   = (sel.value === 'page') ? '' : 'none';
lblPages.style.display    = (sel.value === 'page' && hasIds) ? '' : 'none';
pagesInput.style.display  = (sel.value === 'page' && hasIds) ? '' : 'none';

addPageBtn.style.display  = (sel.value === 'page') ? '' : 'none';

pagesWrap.appendChild(addPageBtn);

                    sel.addEventListener('change', function() {
  const isPage = (sel.value === 'page');
  const hasIds = pagesInput.value.trim().length > 0;

  pagesWrap.style.display   = isPage ? '' : 'none';
  lblPages.style.display    = (isPage && hasIds) ? '' : 'none';
  pagesInput.style.display  = (isPage && hasIds) ? '' : 'none';
  if (addPageBtn) addPageBtn.style.display = isPage ? '' : 'none';

  saveRow();
});

                    const up = iconBtn('↑', 'Monter', function() {
                        move(idx, -1);
                    });
                    const down = iconBtn('↓', 'Descendre', function() {
                        move(idx, 1);
                    });
                    const del = iconBtn('🗑️', 'Supprimer', function() {
                        data.menus.splice(idx, 1);
                        render();
                        notify();
                    });

                    function saveRow() {
                        const base = {
                            label: label.value.trim() || ('Entrée ' + (idx + 1)),
                            enabled: chk.checked,
                            action: sel.value
                        };
                        if (sel.value === 'page') {
                            const ids = pagesInput.value.split(',').map(function(s) {
                                return s.trim();
                            }).filter(Boolean);

                            if (ids.length === 0) {
                                const id = newPageId();
                                ensurePage(id, base.label);
                                ids.push(id);
                            }
                            base.pages = ids;
                        }
                        data.menus[idx] = base;
                        if (typeof notify === 'function') notify();
                    }

                    chk.addEventListener('change', saveRow);
                    label.addEventListener('input', saveRow);
                    pagesInput.addEventListener('input', saveRow);

                    const row = el('div', {
                            class: 'mj-item'
                        },
                        chk,
                        el('div', {
                            class: 'mj-grow'
                        }, label),
                        el('div', {}, sel),
                        el('div', {
                            class: 'mj-grow'
                        }, pagesWrap),
                        el('div', {
                            class: 'mj-actions'
                        }, up, down, del)
                    );
                    return row;
                }

                function move(i, dir) {
                    const j = i + dir;
                    if (j < 0 || j >= data.menus.length) return;
                    const t = data.menus[i];
                    data.menus[i] = data.menus[j];
                    data.menus[j] = t;
                    render();
                    if (typeof notify === 'function') notify();
                }

                function render() {
                    list.innerHTML = '';
                    data.menus.forEach(function(m, i) {
                        list.appendChild(rowItem(m, i));
                    });
                }

                const add = iconBtn('+ Ajouter un menu', 'Ajouter', function() {

                    const id = newPageId();
                    ensurePage(id, 'NOUVELLE PAGE');
                    data.menus.push({
                        label: '➤ NOUVEL ÉLÉMENT',
                        action: 'page',
                        enabled: true,
                        pages: [id]
                    });
                    render();
                    if (typeof notify === 'function') notify();
                });

                wrap.appendChild(list);
                wrap.appendChild(el('div', {
                    class: 'mj-actions'
                }, add));
                render();
                root.appendChild(wrap);
            }

            function buildPagesUI(root, data, notify) {
                const wrap = el('div', {
                    class: 'mj-col'
                });
                wrap.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Pages personnalisées'));

                const bar = el('div', {
                    class: 'mj-flex'
                });
                const sel = el('select', {
                    class: 'mj-grow'
                });

                function newPageId() {
                    let id = 'page' + (Object.keys(data.pages || {}).length + 1);
                    while ((data.pages || {})[id]) id += '_x';
                    return id;
                }

                const add = el('button', {
                    class: 'mj-btn',
                    onclick: function() {
                        const id = newPageId();
                        data.pages[id] = {
                            title: 'PAGE',
                            body: '(contenu)'
                        };
                        renderList(id);
                        if (typeof notify === 'function') notify();
                    }
                }, '+ Nouvelle page');

                const del = el('button', {
                    class: 'mj-btn',
                    onclick: function() {
                        const id = sel.value;
                        if (!id) return;
                        delete data.pages[id];
                        renderList(Object.keys(data.pages)[0] || '');
                        if (typeof notify === 'function') notify();
                    }
                }, '🗑️ Supprimer');

                bar.appendChild(sel);
                bar.appendChild(add);
                bar.appendChild(del);

                const title = el('input', {
                    type: 'text',
                    placeholder: 'Titre'
                });
                const body = el('textarea', {
                    placeholder: 'Contenu'
                });

                function renderList(pickId) {
                    sel.innerHTML = '';
                    const ids = Object.keys(data.pages || {});
                    ids.forEach(function(id) {
                        sel.appendChild(el('option', {
                            value: id,
                            selected: id === pickId
                        }, id));
                    });
                    if (!ids.length) {
                        title.value = '';
                        body.value = '';
                        title.disabled = true;
                        body.disabled = true;
                        del.disabled = true;
                    } else {
                        title.disabled = false;
                        body.disabled = false;
                        del.disabled = false;
                        sel.value = pickId || ids[0];
                        const p = data.pages[sel.value];
                        title.value = p.title || '';
                        body.value = p.body || '';
                    }
                }

                sel.addEventListener('change', function() {
                    const p = data.pages[sel.value];
                    if (!p) return;
                    title.value = p.title || '';
                    body.value = p.body || '';
                });
                title.addEventListener('input', function() {
                    const id = sel.value;
                    if (!data.pages[id]) return;
                    data.pages[id].title = title.value;
                    if (typeof notify === 'function') notify();
                });
                body.addEventListener('input', function() {
                    const id = sel.value;
                    if (!data.pages[id]) return;
                    data.pages[id].body = body.value;
                    if (typeof notify === 'function') notify();
                });

                renderList(Object.keys(data.pages || {})[0] || '');

document.addEventListener('mj-pages-updated', function(){
  renderList(sel.value);
});

                wrap.appendChild(bar);
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Titre'), title));
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Corps'), body));
                root.appendChild(wrap);
            }

            function buildBannerUI(root, data, notify) {
                const wrap = el('div', {
                    class: 'mj-col'
                });
                wrap.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Titres & Bannière'));

                const title = el('input', {
                    type: 'text',
                    value: data.title || ''
                });
                const subtitle = el('input', {
                    type: 'text',
                    value: data.subtitle || ''
                });
                const banner = el('textarea');
                banner.value = (data.banner || []).join('\n');

                title.addEventListener('input', function() {
                    data.title = title.value;
                    if (typeof notify === 'function') notify();
                });
                subtitle.addEventListener('input', function() {
                    data.subtitle = subtitle.value;
                    if (typeof notify === 'function') notify();
                });
                banner.addEventListener('input', function() {
                    data.banner = String(banner.value).split('\n').map(function(s) {
                        return s.trim();
                    }).filter(Boolean);
                    if (typeof notify === 'function') notify();
                });

                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Titre'), title));
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Sous-titre'), subtitle));
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Bannière (1 ligne = 1 entrée)'), banner));

                root.appendChild(wrap);
            }

            function buildStatusUI(root, data, notify) {
                const wrap = el('div', {
                    class: 'mj-col'
                });
                wrap.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Aide & Statuts'));
                const help = el('textarea');
                help.value = (data.help || []).join('\n');
                const pwr = el('input', {
                    type: 'text',
                    value: data.statPower || ''
                });
                const door = el('input', {
                    type: 'text',
                    value: data.statDoor || ''
                });

                help.addEventListener('input', function() {
                    data.help = String(help.value).split('\n').map(function(s) {
                        return s.trim();
                    }).filter(Boolean);
                    if (typeof notify === 'function') notify();
                });
                pwr.addEventListener('input', function() {
                    data.statPower = pwr.value;
                    if (typeof notify === 'function') notify();
                });
                door.addEventListener('input', function() {
                    data.statDoor = door.value;
                    if (typeof notify === 'function') notify();
                });

                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'Aide (1 ligne = 1 astuce)'), help));
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'ALIM'), pwr));
                wrap.appendChild(el('div', {
                    class: 'mj-field'
                }, el('label', {}, 'PORTE'), door));
                root.appendChild(wrap);
            }

            function buildLogsUI(root, data, notify) {
                const wrap = el('div', {
                    class: 'mj-row mj-row-1'
                });
                const colL = el('div', {
                    class: 'mj-col'
                });
                const colR = el('div', {
                    class: 'mj-col'
                });
                colL.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Journaux'));
                colR.appendChild(el('div', {
                    class: 'mj-h'
                }, 'Mémos'));
                const logs = el('textarea');
                logs.value = (data.logs || []).join('\n');
                const memos = el('textarea');
                memos.value = (data.memos || []).join('\n');

                logs.addEventListener('input', function() {
                    data.logs = String(logs.value).split('\n').map(function(s) {
                        return s.trim();
                    }).filter(Boolean);
                    if (typeof notify === 'function') notify();
                });
                memos.addEventListener('input', function() {
                    data.memos = String(memos.value).split('\n').map(function(s) {
                        return s.trim();
                    }).filter(Boolean);
                    if (typeof notify === 'function') notify();
                });

                colL.appendChild(logs);
                colR.appendChild(memos);
                wrap.appendChild(colL);
                wrap.appendChild(colR);
                root.appendChild(wrap);
            }

            function buildFooter(root, getData, opts) {
                const bar = el('div', {
                    class: 'mj-divider'
                });
                const row = el('div', {
                        class: 'mj-flex'
                    },
                    el('div', {
                        class: 'mj-note mj-grow mj-muted'
                    }, 'Astuce : "Enregistrer" renvoie l’objet complet.'),
                    iconBtn('💾 Enregistrer', 'onSave()', function() {
                        if (opts.onSave) opts.onSave(getData());
                    }),
                    iconBtn('Afficher JSON', 'Debug', function() {
                        try {
                            console.log('MJEditor data:', getData());
                        } catch (e) {}
                    })
                );
                root.appendChild(bar);
                root.appendChild(row);
            }

            function renderTabs(container, order) {
                const bar = el('div', {
                    class: 'mj-tabs'
                });
                const pages = {};
                order.forEach(function(id) {
                    const btn = el('button', {
                        class: 'mj-btn',
                        'data-tab': id
                    }, id.toUpperCase());
                    const page = el('div', {
                        class: 'mj-tabpage',
                        id: 'tab-' + id
                    });
                    btn.addEventListener('click', function() {
                        const all = container.querySelectorAll('.mj-tabpage');
                        for (let i = 0; i < all.length; i++) {
                            all[i].classList.remove('active');
                        }
                        page.classList.add('active');
                    });
                    bar.appendChild(btn);
                    container.appendChild(bar);
                    container.appendChild(page);
                    pages[id] = page;
                });
                setTimeout(function() {
                    const first = container.querySelector('.mj-tabpage');
                    if (first) first.classList.add('active');
                }, 0);
                return {
                    bar: bar,
                    pages: pages
                };
            }

            function renderTabsAndPages(root, data, opts) {
                const tabs = (opts.tabs || ['menus', 'pages', 'banniere', 'statuts', 'journaux']);
                const tmp = renderTabs(root, tabs);
                const pages = tmp.pages;

                const notify = function() {
                    if (opts.onChange) opts.onChange(getData());
                };
                const getData = function() {
                    return JSON.parse(JSON.stringify(data));
                };

                if (pages.menus) buildMenusUI(pages.menus, data, notify);
                if (pages.pages) buildPagesUI(pages.pages, data, notify);
                if (pages.banniere) buildBannerUI(pages.banniere, data, notify);
                if (pages.statuts) buildStatusUI(pages.statuts, data, notify);
                if (pages.journaux) buildLogsUI(pages.journaux, data, notify);

                buildFooter(root, getData, opts);
                return {
                    getData: getData
                };
            }

            const MJ_API = {
                init: function(container, initialData, options) {
                    const root = (typeof container === 'string') ? document.querySelector(container) : container;
                    if (!root) throw new Error('MJEditor: container introuvable');
                    const opts = Object.assign({
                        onChange: null,
                        onSave: null,
                        tabs: ['menus', 'pages', 'banniere', 'statuts', 'journaux']
                    }, options || {});
                    const data = ensureData(initialData);
                    root.innerHTML = '';
                    const api = renderTabsAndPages(root, data, opts);
                    return api;
                },
                defaults: function() {
                    return deepClone(DEF);
                }
            };

            try {
                global.MJEditor = MJ_API;
            } catch (e) {}
            try {
                window.MJEditor = MJ_API;
            } catch (e) {}
            try {
                globalThis.MJEditor = MJ_API;
            } catch (e) {}
        })(typeof window !== 'undefined' ? window : this);
    </script>

            /* ---- Hack ---- */
            const DIFF = {
                facile: 10,
                normal: 14,
                difficile: 18,
                expert: 24
            };
            let H = null;

            function stripAccents(s) {
                try {
                    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                } catch {
                    return s;
                }
            }

            function sourceBank() {
                const raw = (set.wordMode === 'custom' && set.hackWords && set.hackWords.length) ? set.hackWords : (BANKS[set.wordMode] || BANKS.fallout);
                return raw.map(w => stripAccents(String(w)).replace(/\s+/g, '').toUpperCase()).filter(w => w.length >= 5 && w.length <= 12);
            }

            function like(a, b) {
                let s = 0;
                for (let i = 0; i < Math.min(a.length, b.length); i++) {
                    if (a[i] === b[i]) s++;
                }
                return s;
            }

            function overlap(a, b) {
                const setB = new Set(b.split(''));
                let c = 0;
                const seen = new Set();
                for (const ch of a) {
                    if (!seen.has(ch) && setB.has(ch)) {
                        c++;
                        seen.add(ch);
                    }
                }
                return c;
            }

            function mostCommonLength(arr) {
                const freq = {};
                for (const w of arr) {
                    const L = w.length;
                    freq[L] = (freq[L] || 0) + 1;
                }
                let bestLen = 6,
                    bestCt = 0;
                for (const k in freq) {
                    const L = +k,
                        ct = freq[k];
                    if (ct > bestCt || (ct === bestCt && Math.abs(L - 8) < Math.abs(bestLen - 8))) {
                        bestCt = ct;
                        bestLen = L;
                    }
                }
                return bestLen;
            }

            function buildHackSet() {
                const src = sourceBank();
                const need = DIFF[set.hackDifficulty || 'normal'] || 14;
                if (src.length === 0) {
                    return {
                        words: ['TERMINAL', 'SECURITE', 'NUCLEAIRE', 'GENERATEUR'],
                        solution: 'SECURITE'
                    };
                }
                const targetLen = mostCommonLength(src);
                let candidates = src.filter(w => w.length === targetLen);
                if (candidates.length < need) candidates = src.filter(w => Math.abs(w.length - targetLen) <= 1);
                const solution = candidates[(Math.random() * candidates.length) | 0];
                const scored = candidates.filter(w => w !== solution).map(w => ({
                    w,
                    pos: like(w, solution),
                    ov: overlap(w, solution)
                }));
                scored.sort((a, b) => (b.pos - a.pos) || (b.ov - a.ov));
                const takeClose = Math.max(1, Math.round((need - 1) * 0.6));
                const close = scored.slice(0, takeClose);
                const rest = scored.slice(takeClose).sort(() => Math.random() - 0.5);
                const mid = rest.slice(0, Math.max(0, (need - 1) - close.length));
                const words = [solution, ...close.map(x => x.w), ...mid.map(x => x.w)];
                const used = new Set(words);
                for (const w of src) {
                    if (words.length >= need) break;
                    if (!used.has(w) && Math.abs(w.length - solution.length) <= 1) {
                        words.push(w);
                        used.add(w);
                    }
                }
                for (let i = words.length - 1; i > 0; i--) {
                    const j = (Math.random() * (i + 1)) | 0;
                    [words[i], words[j]] = [words[j], words[i]];
                }
                return {
                    words,
                    solution
                };
            }

            function buildHackWall(words, cols = 60, rows = 18) {
                const charset = '!@#$%^&*(){}[]<>?/|\\=+-.;:,_ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const mask = Array.from({
                    length: rows
                }, () => Array(cols).fill(null));

                function canPlace(r, c, len) {
                    if (c + len > cols) return false;
                    for (let i = 0; i < len; i++) {
                        if (mask[r][c + i]) return false;
                    }
                    return true;
                }

                function placeWord(word) {
                    let tries = 400;
                    const len = word.length;
                    word = word.toUpperCase();
                    while (tries--) {
                        const r = (Math.random() * rows) | 0;
                        const c = (Math.random() * (cols - len)) | 0;
                        if (canPlace(r, c, len)) {
                            mask[r][c] = {
                                word,
                                len
                            };
                            for (let i = 1; i < len; i++) mask[r][c + i] = {
                                taken: true
                            };
                            return true;
                        }
                    }
                    return false;
                }
                words.forEach(w => placeWord(w));
                const lines = [];
                for (let r = 0; r < rows; r++) {
                    let line = '';
                    for (let c = 0; c < cols; c++) {
                        const cell = mask[r][c];
                        if (cell && cell.word) {
                            line += `<button class="w" data-w="${cell.word}" type="button">${cell.word}</button>`;
                            c += cell.len - 1;
                        } else if (cell && cell.taken) {
                            continue;
                        } else {
                            const ch = charset[(Math.random() * charset.length) | 0];
                            line += `<span class="c">${ch}</span>`;
                        }
                    }
                    lines.push(line);
                }
                return lines.join('\n');
            }

            function likePercent(a, b) {
                const score = like(a, b);
                return Math.round((score / Math.max(a.length, b.length)) * 100);
            }

            function randomGarble(len) {
                const chars = '!@#$%^&*(){}[]<>?/|\\=+-.;:,_';
                let s = '';
                for (let i = 0; i < len; i++) {
                    s += chars[(Math.random() * chars.length) | 0];
                }
                return s;
            }

            function glitchWord(el) {

            let glitchTimer = null;

            function startWordGlitch() {
                if (glitchTimer) return;

                if (!wall) return;
                const words = [...wall.querySelectorAll('.w')];
                words.forEach(w => {

                glitchTimer = setInterval(() => {
                    const hw = document.getElementById('hackWall');
                    if (!hw) {
                        stopWordGlitch();
                        return;

                    const count = Math.max(1, Math.min(2, Math.round(words.length * 0.03)));
                    for (let i = 0; i < count; i++) {
                        const btn = words[(Math.random() * words.length) | 0];
                        if (!btn) continue;
                        const orig = btn.dataset.orig || btn.textContent;
                        btn.textContent = randomGarble(orig.length);
                        setTimeout(() => {
                            if (btn && btn.isConnected) btn.textContent = btn.dataset.orig || orig;
                        }, 110 + ((Math.random() * 110) | 0));
                    }
                }, 2000);
            }

            function stopWordGlitch() {

                    glitchTimer = null;

            function setupTabs4(defaultTab) {
                const panel = document.getElementById('adminPanel');
                if (!panel) return;

                // --- repères de colonnes / sections
                const two = panel.querySelector('.two');
                const colLeft = two ? two.firstElementChild : null; // réglages
                const colRight = two ? two.lastElementChild : null; // import/export
                const headings = Array.from(panel.querySelectorAll('.h'));
                const hGeneral = headings.find(h => /réglages\s*g(é|e)n(é|e)raux/i.test(h.textContent || ''));
                const hIO = headings.find(h => /import\s*\/\s*export/i.test(h.textContent || ''));
                const wiz = document.getElementById('wizRoot');

                // récupérer les éléments "de la section" depuis le titre .h jusqu’au prochain .h
                function takeRangeFrom(h) {
                    const out = [];
                    if (!h) return out;
                    out.push(h);
                    let n = h.nextElementSibling;
                    while (n && !n.classList.contains('h')) {
                        out.push(n);
                        n = n.nextElementSibling;
                    }
                    return out;
                }
                const secGeneralEls = takeRangeFrom(hGeneral);
                const secIOEls = takeRangeFrom(hIO);

                // --- barre d’onglets (créée une fois)
                let nav = panel.querySelector('.admin-tabs');
                if (!nav) {
                    nav = document.createElement('div');
                    nav.className = 'admin-tabs';
                    nav.innerHTML = `
      <button type="button" class="admin-tab" data-tab="hack">Hack</button>
      <button type="button" class="admin-tab" data-tab="effects">Effets</button>
     <button type="button" class="admin-tab" data-tab="admin">Administration</button>
      <button type="button" class="admin-tab" data-tab="editor">Éditeur</button>
    `;
                    const firstH = headings[0];
                    if (firstH) firstH.parentNode.insertBefore(nav, firstH);
                }

                // --- mapping : quels IDs montrer dans chaque sous-onglet
                const MAP = {
                    hack: [
                        'setGateOn', 'setGamePwd',
                        'setHackAtStart', 'setHackThreshold',
                        'setWordMode', 'customWordsWrap', 'setHackWords',
                        'setHackDifficulty', 'setHackTries'
                    ],
                    effects: [
                        'setTheme', 'setBootAlways',
                        'setSfx', 'setGlitch', 'setWordGlitch'
                    ],
                    admin: [
                        'setAdminPwd' // ← Mot de passe MJ ici
                    ]
                };

                // --- helpers d’affichage
                function hideAll() {
                    if (colLeft) colLeft.hidden = true;
                    if (colRight) colRight.hidden = true;
                    secGeneralEls.forEach(el => el.hidden = true);
                    secIOEls.forEach(el => el.hidden = true);
                    if (wiz) wiz.hidden = true;
                }

                function showSettingsSubtab(kind) {
                    if (!colLeft) return;
                    colLeft.hidden = false; // on montre la colonne gauche
                    secGeneralEls.forEach(el => el.hidden = false); // ... mais on masque ses champs inutilement
                    if (hGeneral) hGeneral.hidden = true; // on ne veut plus voir "Réglages généraux"
                    // masquer tous les <label> de la section…
                    Array.from(colLeft.querySelectorAll('label')).forEach(l => l.hidden = true);
                    // …et ne ré-afficher que les contrôles requis
                    (MAP[kind] || []).forEach(id => {
                        const el = panel.querySelector('#' + id);
                        if (!el) return;
                        (el.closest('label') || el).hidden = false;
                    });
                }

                const LS_KEY = 'ft_admin_tabs4_v1';

                function activate(tab) {
                    hideAll();
                    // cache explicitement le titre “Éditeur” quand on n’est pas dans l’onglet
                    if (tab !== 'editor') {
                        const hEd = Array.from(panel.querySelectorAll('.h'))
                            .find(h => /éditeur/i.test(h.textContent || ''));
                        if (hEd) hEd.hidden = true;
                    }

                    if (tab === 'hack') showSettingsSubtab('hack');
                    else if (tab === 'effects') showSettingsSubtab('effects');
                    else if (tab === 'admin') {
                        // Colonne gauche : ne montrer que "Mot de passe MJ"
                        showSettingsSubtab('admin');

                        // Colonne droite : tout le bloc Import/Export + Rebasculer/Débloquer visibles
                        if (colRight) {
                            colRight.hidden = false;
                            secIOEls.forEach(el => el.hidden = false);

                            const lockRow = panel.querySelector('#lockNow')?.closest('.mj-actions');
                            if (lockRow) lockRow.hidden = false;
                            const unlockRow = panel.querySelector('#unlockTerminal')?.closest('.mj-actions');
                            if (unlockRow) unlockRow.hidden = false;
                        }
                    } else if (tab === 'editor') {
                        if (wiz) wiz.hidden = false;
                    }

                    nav.querySelectorAll('.admin-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                    try {
                        localStorage.setItem(LS_KEY, tab);
                    } catch {}
                }

                // événements onglets
                nav.addEventListener('click', e => {
                    const b = e.target.closest('.admin-tab');
                    if (!b) return;
                    activate(b.dataset.tab);
                });
                nav.addEventListener('keydown', e => {
                    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
                    e.preventDefault();
                    const all = Array.from(nav.children);
                    const cur = all.findIndex(b => b.classList.contains('active'));
                    const next = e.key === 'ArrowRight' ? (cur + 1) % all.length : (cur - 1 + all.length) % all.length;
                    activate(all[next].dataset.tab);
                    all[next].focus();
                });

                const allowed = ['hack', 'effects', 'admin', 'editor'];

                const saved = localStorage.getItem(LS_KEY);
                const initial = (defaultTab && allowed.includes(defaultTab)) ?
                    defaultTab // on force l’onglet demandé
                    :
                    (allowed.includes(saved) ? saved : 'hack'); // sinon on reprend le dernier ou 'hack'
                activate(initial);

            }

                        });
                    }

                } catch (e) {
                    console.error('renderAdmin error:', e);
                    alert('Erreur panneau MJ : ' + e.message);

            }

    return (I18N[L] && I18N[L][key]) || (I18N.fr[key] || key);
  }catch(_){ return key; }
}
function applyLanguage(){
  try{
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if(k) el.textContent = t(k);
    });
  }catch(_){}
}
// Bind after admin renders, so #setLang exists
(function(){
  try{
    var _ra = window.renderAdmin;
    if(typeof _ra === 'function'){
      window.renderAdmin = function(){
        var r = _ra.apply(this, arguments);
        try{
          var sel = document.getElementById('setLang');
          if(sel){
            sel.value = (typeof set!=='undefined' && set.lang) ? set.lang : 'fr';
            sel.onchange = function(){
              try{
                if(typeof set!=='undefined'){ set.lang = sel.value; }
                try{ localStorage.setItem('ft_settings_inline_v10', JSON.stringify(set)); }catch(_){}
                applyLanguage();
                try{ if(typeof renderHeader==='function'){ renderHeader(); } }catch(_){}
              }catch(_){}
            };
          }
          applyLanguage();
        }catch(_){}
        return r;
      };
    }
    // Also apply on DOM ready
    if(document.readyState !== 'loading'){ applyLanguage(); }
    else document.addEventListener('DOMContentLoaded', applyLanguage);
  }
  catch(_){ }
})();
</script>

function translateAllContent(lang){
  try{
    // 1) UI strings via data-i18n
    applyLanguage();
    // 2) Data object (only for known default fields). We do not touch custom pages.
    var pack = DATA_I18N[lang] || DATA_I18N.fr;
    // Top-level texts
    if (pack.title)    data.title = pack.title;
    if (pack.subtitle) data.subtitle = pack.subtitle;
    if (pack.banner)   data.banner  = pack.banner.slice();
    if (pack.help)     data.help    = pack.help.slice();
    if (pack.statPower) data.statPower = pack.statPower;
    if (pack.statDoor)  data.statDoor  = pack.statDoor;

    // Menus: relabel known actions; keep "page" labels as-is
    if (Array.isArray(data.menus)){
      data.menus = data.menus.map(function(m){
        var out = Object.assign({}, m);
        if (out && out.action && pack.menusByAction && pack.menusByAction[out.action]){
          out.label = pack.menusByAction[out.action];
        }
        return out;
      });
    }

    // Logs & memos: overwrite only if currently equal to the opposite language defaults or to the starting defaults
    function arrEq(a,b){
      if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
      for(var i=0;i<a.length;i++) if(String(a[i])!==String(b[i])) return false;
      return true;
    }
    var other = (lang==='en')?DATA_I18N.fr:DATA_I18N.en;
    if (arrEq(data.logs, other.logs) || arrEq(data.logs, DATA_I18N.fr.logs) || arrEq(data.logs, DATA_I18N.en.logs)){
      data.logs = pack.logs.slice();
    }
    if (arrEq(data.memos, other.memos) || arrEq(data.memos, DATA_I18N.fr.memos) || arrEq(data.memos, DATA_I18N.en.memos)){
      data.memos = pack.memos.slice();
    }

    // Save + re-render
    try{ localStorage.setItem('ft_data_inline_v10', JSON.stringify(data)); }catch(_){}
    try{ localStorage.setItem('ft_settings_inline_v10', JSON.stringify(set)); }catch(_){}
    if (typeof renderHeader==='function') renderHeader();
  }catch(e){
    try{ console.error('translateAllContent error:', e); }catch(_){}
  }
}
</script>

<script>
(function(){
  function findExistingCloseBtn(){
    try{
      var p=document.getElementById('adminPanel'); if(!p) return null;
      // look for any button that likely closes the panel
      var cand=[].slice.call(p.querySelectorAll('button, .btn')).filter(function(b){
        var txt=(b.textContent||'').trim().toLowerCase();
        var k=b.getAttribute && b.getAttribute('data-i18n');
        return (k==='btn.close') || /fermer/.test(txt) || /close/.test(txt);
      });
      return cand[0]||null;
    }catch(_){ return null; }
  }
  function clickVisibleSaveButtons(){
    try{
      var p=document.getElementById('adminPanel'); if(!p) return;
      var activePage = p.querySelector('.mj-tabpage.active') || p;
      // Prefer i18n save buttons inside active tab
      var btns=[].slice.call(activePage.querySelectorAll('button, .btn')).filter(function(b){
        if(b.closest('#adminFooterBar')) return false;
        var k=b.getAttribute && b.getAttribute('data-i18n');
        var txt=(b.textContent||'').trim().toLowerCase();
        return (k==='btn.save') || txt==='enregistrer' || txt==='save';
      });
      if(btns.length){ btns[0].click(); return true; }
      // Fallback: global handlers
      var ok=false;
      try{ if(typeof saveSettings==='function'){ saveSettings(); ok=true; } }catch(_){}
      try{ if(window.MJEditor && typeof MJEditor.save==='function'){ MJEditor.save(); ok=true; } }catch(_){}
      return ok;
    }catch(_){ return false; }
  }
  function ensureAdminFooter(){
    try{
      var p=document.getElementById('adminPanel'); if(!p) return false;
      if(document.getElementById('adminFooterBar')) return true;
      var bar=document.createElement('div');
      bar.id='adminFooterBar';
      bar.innerHTML='<div id="adminSaveSlot" style="margin-right:8px"></div><div id="adminCloseSlot"></div>';
      p.appendChild(bar);
      // Bind buttons
      var save=document.getElementById('adminSaveAll');
      var close=document.getElementById('adminCloseAll');
      if(save){ save.onclick=function(){ try{ clickVisibleSaveButtons(); }catch(_){ } }; }
      if(close){
        close.onclick=function(){
          try{
            var b=findExistingCloseBtn();
            if(b){ b.click(); }
            else{
              var panel=document.getElementById('adminPanel');
              if(panel && panel.classList) panel.classList.remove('active');
            }
          }catch(_){}
        };
      }
      // i18n apply for our buttons if available
      try{ if(typeof applyLanguage==='function') applyLanguage(); }catch(_){}
      return true;
    }catch(_){ return false; }
  }

      function relocateCloseButton(){
        try{
          var p=document.getElementById('adminPanel'); if(!p) return false;
          var slot=document.getElementById('adminCloseSlot'); if(!slot) return false;
          // Cleanup previous
          while(slot.firstChild) slot.removeChild(slot.firstChild);
          // Find the existing close button
          var closeReal=document.getElementById('closeAdmin');
          if(!closeReal) return false;
          // Hide the original container row (the block with "Échap = fermer")
          try{
            var row=closeReal.closest('div');
            // The row is inside a wrapper with a <span class="tiny">Échap = fermer</span> above
            var wrapper = row && row.parentElement;
            if(wrapper){
              wrapper.style.display='none';
            }
          }catch(_){}
          // Move the real button
          slot.appendChild(closeReal);
          // Ensure visual consistency
          closeReal.classList.add('btn');
          closeReal.style.margin='0';
          return true;
        }catch(_){ return false; }
      }

      function relocateSaveButton(){
        try{
          var p=document.getElementById('adminPanel'); if(!p) return false;
          var slot=document.getElementById('adminSaveSlot'); if(!slot) return false;
          // Cleanup any previous moved save button in slot
          while(slot.firstChild) slot.removeChild(slot.firstChild);
          // Find active tab page
          var active=p.querySelector('.mj-tabpage.active')||p;
          // Look for a button with text "Enregistrer réglages" (FR) or "Save settings" (EN)
          var candidates=[].slice.call(active.querySelectorAll('button,.btn')).filter(function(b){
            var txt=(b.textContent||'').trim().toLowerCase();
            if(b.closest('#adminFooterBar')) return false;
            return txt.includes('enregistrer réglages') || txt==='/ enregistrer réglages' || txt.includes('save settings');
          });
          // Fallbacks: any button with data-i18n="btn.save" inside the active page
          if(!candidates.length){
            candidates=[].slice.call(active.querySelectorAll('[data-i18n=\"btn.save\"]'));
          }
          if(!candidates.length) return false;
          var saveBtn=candidates[0];
          // Move the button into the slot (keeps events)
          slot.appendChild(saveBtn);
          // make it primary-ish
          saveBtn.classList.add('btn','primary');
          saveBtn.style.minWidth='auto';
          saveBtn.style.margin='0';
          return true;
        }catch(_){ return false; }
      }

  // Hook renderAdmin to (re)append/footer
  try{
    var _ra=window.renderAdmin;
    if(typeof _ra==='function'){
      window.renderAdmin=function(){
        var r=_ra.apply(this, arguments);
        try{ ensureAdminFooter(); }catch(_){}
        try{ relocateSaveButton(); }catch(_){ }
        try{ relocateSaveButton(); relocateCloseButton(); }catch(_){ }
        return r;
      };
    }else{
      if(document.readyState!=='loading'){ ensureAdminFooter(); }
      else document.addEventListener('DOMContentLoaded', function(){ ensureAdminFooter(); relocateSaveButton(); relocateCloseButton(); });
    }
  }catch(_){}
})();
</script>
